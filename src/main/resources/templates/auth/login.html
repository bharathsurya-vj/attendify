<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — ATTENDIFY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F5F7FB;font-family:sans-serif;">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm border-0 p-4 w-100" style="max-width:420px;border-radius:14px;">
        <div class="mb-3">
            <span class="badge" style="background:#4F46E5;font-size:14px;">ATTENDIFY</span>
            <div class="text-muted small mt-1">Smart Attendance. Simplified.</div>
        </div>
        <h4 class="fw-bold mb-3" style="color:#111827;">Welcome back</h4>
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Institutional Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn w-100 text-white fw-semibold py-2" style="background:#4F46E5;">
                Send 6-Digit Email OTP
            </button>
        </form>
    </div>
</div>
</body>
</html>
