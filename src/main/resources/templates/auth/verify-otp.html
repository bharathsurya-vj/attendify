<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify OTP — ATTENDIFY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F5F7FB;font-family:sans-serif;">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm border-0 p-4 w-100" style="max-width:420px;border-radius:14px;">
        <span class="badge mb-2" style="background:#14B8A6;width:fit-content;">Step 2 of 2</span>
        <h4 class="fw-bold mb-2">Check your email</h4>
        <p class="text-muted small">Enter the 6-digit OTP sent via Brevo SMTP to <b th:text="${email}"></b></p>
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
        <form th:action="@{/verify-otp}" method="post">
            <input type="text" name="otpCode" class="form-control form-control-lg text-center fw-bold mb-3"
                   style="letter-spacing:10px;font-size:24px;" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus>
            <button type="submit" class="btn w-100 text-white fw-semibold py-2" style="background:#4F46E5;">Verify &amp; Open Dashboard</button>
        </form>
    </div>
</div>
</body>
</html>
