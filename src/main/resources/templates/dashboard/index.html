<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — ATTENDIFY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F5F7FB;color:#172033;font-family:sans-serif;">
<nav class="navbar navbar-dark px-4 py-3" style="background:#111827;">
    <span class="navbar-brand fw-bold mb-0 h1" style="letter-spacing:1px;">ATTENDIFY <small class="text-info fs-6 fw-normal ms-2">Smart Attendance. Simplified.</small></span>
    <form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-sm btn-outline-light">Sign Out</button></form>
</nav>
<div class="container py-4">
    <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">Students</div><div class="fs-3 fw-bold" th:text="${studentCount}">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">Classes</div><div class="fs-3 fw-bold" th:text="${classCount}">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">Total Present</div><div class="fs-3 fw-bold text-success" th:text="${presentCount}">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">Total Absent</div><div class="fs-3 fw-bold text-danger" th:text="${absentCount}">0</div></div></div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 mb-4">
                <h5 class="fw-bold mb-3">Mark Daily Attendance</h5>
                <form th:action="@{/attendance/mark}" method="post">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <select name="classId" class="form-select form-select-sm" required>
                                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.displayLabel}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select name="subjectId" class="form-select form-select-sm" required>
                                <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.subjectName}"></option>
                            </select>
                        </div>
                        <div class="col-md-4"><input type="date" name="date" class="form-control form-control-sm" th:value="${today}" required></div>
                    </div>
                    <table class="table table-sm align-middle">
                        <thead class="table-light"><tr><th>Reg No</th><th>Student Name</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="st : ${students}">
                            <td class="font-monospace small fw-bold" th:text="${st.registrationNumber}"></td>
                            <td th:text="${st.studentName}"></td>
                            <td>
                                <select th:name="${'status_' + st.id}" class="form-select form-select-sm">
                                    <option value="PRESENT">Present</option>
                                    <option value="ABSENT">Absent</option>
                                    <option value="LATE">Late</option>
                                </select>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="submit" class="btn btn-sm text-white px-4 py-2" style="background:#4F46E5;">Save Attendance to Supabase</button>
                </form>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 mb-4">
                <h6 class="fw-bold mb-3">Add New Student</h6>
                <form th:action="@{/students/add}" method="post">
                    <input type="text" name="studentName" class="form-control form-control-sm mb-2" placeholder="Student Full Name" required>
                    <input type="text" name="registrationNumber" class="form-control form-control-sm mb-2" placeholder="Reg No (e.g. REG2026CS010)" required>
                    <select name="classId" class="form-select form-select-sm mb-3" required>
                        <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.displayLabel}"></option>
                    </select>
                    <button class="btn btn-sm w-100 text-white" style="background:#14B8A6;">Enroll Student</button>
                </form>
            </div>
            <div class="card border-0 shadow-sm p-4">
                <h6 class="fw-bold mb-3">Add Class &amp; Section</h6>
                <form th:action="@{/classes/add}" method="post">
                    <input type="text" name="className" class="form-control form-control-sm mb-2" placeholder="Class Name (e.g. B.Tech ECE)" required>
                    <input type="text" name="sectionName" class="form-control form-control-sm mb-2" placeholder="Section (e.g. B)" required>
                    <input type="text" name="academicYear" class="form-control form-control-sm mb-3" value="2026-2027" required>
                    <button class="btn btn-sm btn-dark w-100">Add Class</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
